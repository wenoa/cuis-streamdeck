name: 🧪 Continuous Integration

on:
  push:
  pull_request:

defaults:
  run:
    working-directory: StreamDeck

jobs:
  test:
    name: 🧪 Plugin test
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: StreamDeck/.node-version
          cache: npm
          cache-dependency-path: StreamDeck/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🎨 Run linter
        run: npx eslint

      - name: 🔎 Check types
        run: npm run typecheck

      - name: 🧪 Run tests with coverage
        run: npm run test:coverage

      - name: 📦 Pack plugin (smoke test)
        run: |
          npm run build
          npm run pack

  release:
    name: 🚀 Release
    runs-on: ubuntu-26.04
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: fregante/setup-git-user@v2

      - uses: actions/setup-node@v7
        with:
          node-version-file: StreamDeck/.node-version

      - name: 🏷️ Set up git-mkver
        uses: cperezabo/setup-git-mkver@v1.2.0
        with:
          version: 1.3.0

      - name: 📝 Update version in files
        run: git-mkver patch

      - name: 📦 Update package-lock.json
        run: npm install

      - name: 🔢 Get version
        id: version
        run: |
          echo "version=$(git mkver next)" | tee -a $GITHUB_OUTPUT

      # Dry run until the first version is ready: nothing is committed, tagged or released.
      # - name: 💾 Commit version changes
      #   run: |
      #     git add .
      #     git commit -m "chore: version update"
      #     git mkver tag
      #     git push && git push --tags

      - name: 📦 Final build
        run: |
          npm run build
          npm run pack

